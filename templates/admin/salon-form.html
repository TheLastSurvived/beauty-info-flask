{% extends "admin/base.html" %}

{% block content %}
<div class="card">
    <div class="card-header bg-white">
        <h4 class="mb-0">{{ title }}</h4>
    </div>
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            <div class="row">
                <div class="col-md-8">
                    <div class="row">
                        <div class="col-md-12 mb-3">
                            <label>Название салона *</label>
                            <input type="text" name="name" class="form-control" value="{{ salon.name if salon else '' }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Категория *</label>
                            <select name="category" class="form-select" required>
                                <option value="">Выберите категорию</option>
                                {% for cat in categories %}
                                <option value="{{ cat }}" {% if salon and salon.category == cat %}selected{% endif %}>{{ cat }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Район</label>
                            <select name="district" class="form-select">
                                <option value="">Выберите район</option>
                                {% for dist in districts %}
                                <option value="{{ dist }}" {% if salon and salon.district == dist %}selected{% endif %}>{{ dist }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label>Описание</label>
                        <textarea name="description" class="form-control" rows="4">{{ salon.description if salon else '' }}</textarea>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-12 mb-3">
                            <label>Адрес</label>
                            <input type="text" name="address" class="form-control" value="{{ salon.address if salon else '' }}">
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>Телефон</label>
                            <input type="text" name="phone" class="form-control" value="{{ salon.phone if salon else '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Время работы</label>
                            <input type="text" name="working_hours" class="form-control" value="{{ salon.working_hours if salon else '' }}" placeholder="Напр.: Пн-Пт: 9:00-20:00, Сб: 10:00-18:00">
                        </div>
                    </div>
                    
                    <!-- ========== БЛОК СОЦИАЛЬНЫХ СЕТЕЙ ========== -->
                    <div class="card mt-3">
                        <div class="card-header bg-light">
                            <h6 class="mb-0"><i class="bi bi-share"></i> Социальные сети</h6>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label>
                                        <i class="bi bi-instagram text-danger"></i> Instagram
                                    </label>
                                    <input type="text" name="social_instagram" class="form-control" 
                                           value="{{ salon.social_instagram if salon else '' }}" 
                                           placeholder="https://instagram.com/...">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label>
                                        <i class="bi bi-vk text-primary"></i> VK
                                    </label>
                                    <input type="text" name="social_vk" class="form-control" 
                                           value="{{ salon.social_vk if salon else '' }}" 
                                           placeholder="https://vk.com/...">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label>
                                        <i class="bi bi-facebook text-primary"></i> Facebook
                                    </label>
                                    <input type="text" name="social_facebook" class="form-control" 
                                           value="{{ salon.social_facebook if salon else '' }}" 
                                           placeholder="https://facebook.com/...">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label>
                                        <i class="bi bi-telegram text-info"></i> Telegram
                                    </label>
                                    <input type="text" name="social_telegram" class="form-control" 
                                           value="{{ salon.social_telegram if salon else '' }}" 
                                           placeholder="https://t.me/...">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-4">
                    <div class="card bg-light">
                        <div class="card-body">
                            <label class="form-label fw-bold">Изображение салона</label>
                            
                            <!-- Превью изображения -->
                            <div class="text-center mb-3">
                                <img id="imagePreview" 
                                     src="{{ salon.image_url if salon and salon.image_url else '/static/img/default.png' }}" 
                                     alt="Превью" 
                                     style="max-width: 100%; max-height: 200px; border-radius: 8px; object-fit: cover;">
                            </div>
                            
                            <!-- Поле для загрузки файла -->
                            <div class="mb-3">
                                <input type="file" name="image_file" id="imageFile" class="form-control" accept="image/*" onchange="previewImage(this)">
                                <small class="text-muted">Поддерживаемые форматы: PNG, JPG, JPEG, GIF, WEBP. Максимум 16MB</small>
                            </div>
                            
                            <!-- Или URL изображения -->
                            <div class="mb-3">
                                <label class="form-label">Или URL изображения</label>
                                <input type="text" name="image_url" class="form-control" value="{{ salon.image_url if salon else '' }}" placeholder="https://example.com/image.jpg">
                                <small class="text-muted">Если загружено файлом, URL будет проигнорирован</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="mt-4">
                <button type="submit" class="btn btn-beauty">Сохранить</button>
                <a href="{{ url_for('admin.salons') }}" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>

<script>
function previewImage(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('imagePreview').src = e.target.result;
        }
        reader.readAsDataURL(input.files[0]);
    }
}
</script>
{% endblock %}
