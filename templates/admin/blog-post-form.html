{% extends "admin/base.html" %}

{% block content %}
<div class="card">
    <div class="card-header bg-white">
        <h4 class="mb-0">{{ title }}</h4>
    </div>
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            <div class="row">
                <div class="col-md-8">
                    <div class="mb-3">
                        <label>Заголовок *</label>
                        <input type="text" name="title" class="form-control" value="{{ post.title if post else '' }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label>Краткое описание (excerpt)</label>
                        <textarea name="excerpt" class="form-control" rows="3">{{ post.excerpt if post else '' }}</textarea>
                        <small class="text-muted">Краткое описание, которое будет отображаться в карточках и превью</small>
                    </div>
                    
                    <div class="mb-3">
                        <label>Содержание *</label>
                        <textarea name="content" class="form-control" rows="10" required>{{ post.content if post else '' }}</textarea>
                        <small class="text-muted">Поддерживается HTML разметка. Для вставки изображений используйте кнопку ниже или загрузите их через форму.</small>
                    </div>
                </div>
                
                <div class="col-md-4">
                    <!-- Изображение статьи -->
                    <div class="card bg-light mb-3">
                        <div class="card-body">
                            <label class="form-label fw-bold">Изображение статьи</label>
                            
                            <div class="text-center mb-3">
                                <img id="imagePreview" 
                                     src="{{ post.image_url if post and post.image_url else '/static/img/blog-default.jpg' }}" 
                                     alt="Превью" 
                                     style="max-width: 100%; max-height: 200px; border-radius: 8px; object-fit: cover;">
                            </div>
                            
                            <div class="mb-3">
                                <input type="file" name="image_file" id="imageFile" class="form-control" accept="image/*" onchange="previewImage(this)">
                                <small class="text-muted">Загрузите изображение для статьи</small>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Или URL изображения</label>
                                <input type="text" name="image_url" class="form-control" value="{{ post.image_url if post else '' }}">
                            </div>
                        </div>
                    </div>
                    
                    <!-- Настройки статьи -->
                    <div class="card bg-light mb-3">
                        <div class="card-body">
                            <div class="mb-3">
                                <label>Автор</label>
                                <input type="text" name="author" class="form-control" value="{{ post.author if post else 'Администратор' }}">
                            </div>
                            
                            <div class="mb-3">
                                <label>Категория</label>
                                <select name="category" class="form-select">
                                    <option value="">Без категории</option>
                                    {% for cat in categories %}
                                    <option value="{{ cat }}" {% if post and post.category == cat %}selected{% endif %}>{{ cat }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label>Теги (через запятую)</label>
                                <input type="text" name="tags" class="form-control" value="{{ current_tags if post else '' }}" placeholder="Напр.: красота, уход, советы">
                            </div>
                            
                            <div class="mb-3 form-check">
                                <input type="checkbox" name="is_published" class="form-check-input" id="published" {% if not post or post.is_published %}checked{% endif %}>
                                <label class="form-check-label" for="published">Опубликовать</label>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Кнопка для вставки изображения в редактор -->
                    <div class="card bg-light">
                        <div class="card-body">
                            <label class="form-label fw-bold">Вставка изображения в текст</label>
                            <input type="file" id="editorImageInput" class="form-control mb-2" accept="image/*">
                            <button type="button" class="btn btn-sm btn-beauty w-100" onclick="insertImageToEditor()">
                                <i class="bi bi-image"></i> Вставить изображение в текст
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="mt-4">
                <button type="submit" class="btn btn-beauty">Сохранить</button>
                <a href="{{ url_for('admin.blog_posts') }}" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>

<script>
function previewImage(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('imagePreview').src = e.target.result;
        }
        reader.readAsDataURL(input.files[0]);
    }
}

async function insertImageToEditor() {
    const fileInput = document.getElementById('editorImageInput');
    const file = fileInput.files[0];
    
    if (!file) {
        alert('Пожалуйста, выберите изображение');
        return;
    }
    
    // Проверка размера файла (максимум 16MB)
    if (file.size > 16 * 1024 * 1024) {
        alert('Файл слишком большой. Максимальный размер 16MB');
        return;
    }
    
    // Проверка типа файла
    const allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/gif', 'image/webp'];
    if (!allowedTypes.includes(file.type)) {
        alert('Неподдерживаемый формат файла. Используйте JPG, PNG, GIF или WEBP');
        return;
    }
    
    const formData = new FormData();
    formData.append('file', file);
    
    // Показываем индикатор загрузки
    const button = event.target;
    const originalText = button.innerHTML;
    button.innerHTML = '<i class="bi bi-hourglass-split"></i> Загрузка...';
    button.disabled = true;
    
    try {
        const response = await fetch('/admin/upload/editor-image', {
            method: 'POST',
            body: formData
        });
        
        const result = await response.json();
        
        if (result.location) {
            const contentTextarea = document.querySelector('textarea[name="content"]');
            const imageHtml = `<img src="${result.location}" alt="Изображение" style="max-width: 100%; height: auto; margin: 10px 0;">\n\n`;
            
            // Вставляем изображение в текущую позицию курсора
            const start = contentTextarea.selectionStart;
            const end = contentTextarea.selectionEnd;
            const text = contentTextarea.value;
            contentTextarea.value = text.substring(0, start) + imageHtml + text.substring(end);
            
            alert('Изображение успешно вставлено!');
            fileInput.value = '';
        } else {
            alert(result.error || 'Ошибка при загрузке изображения');
        }
    } catch (error) {
        console.error('Ошибка:', error);
        alert('Произошла ошибка при загрузке. Попробуйте еще раз.');
    } finally {
        button.innerHTML = originalText;
        button.disabled = false;
    }
}
</script>
{% endblock %}
